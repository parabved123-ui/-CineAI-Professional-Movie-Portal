{% extends 'base.html' %}{% block title %}{{ action }} — CineAI{% endblock %}{% block content %}<section class="shell page-section"><div class="form-card"><span class="eyebrow">CATALOG MANAGEMENT</span><h1>{{ action }}</h1><p>Keep the movie information clean and presentation-ready.</p><form method="post"><div class="form-grid"><div><label>ID</label><input name="id" type="number" required value="{{ movie.id if movie else '' }}" {% if movie %}readonly{% endif %}></div><div><label>Year</label><input name="year" type="number" required value="{{ movie.year if movie else '' }}"></div></div><label>Title</label><input name="title" required value="{{ movie.title if movie else '' }}"><label>Genre</label><input name="genre" required value="{{ movie.genre if movie else '' }}"><label>Director</label><input name="director" required value="{{ movie.director if movie else '' }}"><label>Description</label><textarea name="description" rows="5" required>{{ movie.description if movie else '' }}</textarea><label>Poster URL</label><input name="poster" required value="{{ movie.poster if movie else '' }}"><label>Backdrop URL</label><input name="backdrop" value="{{ movie.backdrop if movie else '' }}"><button class="primary-btn" type="submit">{{ action }} →</button></form></div></section>{% endblock %}
